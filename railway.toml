# OakstrattonIMA — Railway Configuration
#
# This file applies ONLY to the backend service.
# dockerfilePath is intentionally NOT set here so each Railway service
# can configure its own Dockerfile path in the dashboard without being
# overridden.
#
# Dashboard settings per service:
#   Backend:  Dockerfile Path = backend/Dockerfile  (Root Directory: blank)
#   Worker:   Dockerfile Path = backend/Dockerfile.celery  (Root Directory: blank)
#   Frontend: Dockerfile Path = frontend/Dockerfile  (Root Directory: blank)

[build]
builder = "DOCKERFILE"

[deploy]
startCommand = "./start.sh"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
